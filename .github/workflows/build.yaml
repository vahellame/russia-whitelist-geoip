name: build

on:
  push:
    branches: [main]
    paths:
      - "data/final/**"
      - "config.json"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install v2fly/geoip
        run: go install github.com/v2fly/geoip@202608050239

      - name: Build geoip.dat
        run: geoip -c config.json

      - name: Sanity check
        working-directory: output
        run: |
          test -s geoip.dat
          test "$(stat -c %s geoip.dat)" -ge 300

      - name: Checksum
        working-directory: output
        run: |
          sha256sum geoip.dat | tee geoip.dat.sha256sum
          sha256sum geoip.dat | cut -d' ' -f1 > geoip.dat.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: geoip
          path: output/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geoip
          path: output

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.run_number }}
          draft: true
          files: |
            output/geoip.dat
            output/geoip.dat.sha256
            output/geoip.dat.sha256sum

      - name: Verify assets
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in geoip.dat geoip.dat.sha256 geoip.dat.sha256sum; do
            echo "$names" | grep -qx "$f" || { echo "missing asset: $f" >&2; exit 1; }
          done

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Notify routing
        env:
          GH_TOKEN: ${{ secrets.ROUTING_DISPATCH_TOKEN }}
        run: gh api repos/vahellame/russia-whitelist-routing/dispatches -f event_type=geo-updated
