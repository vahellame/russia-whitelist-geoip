name: build

on:
  push:
    branches: [main]
    paths:
      - "data/final/**"
      - "config.json"
      - ".github/scripts/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  SINGBOX_VERSION: 1.13.16
  MIHOMO_VERSION: v1.19.29

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install v2fly/geoip
        run: go install github.com/v2fly/geoip@202608050239

      - name: Install sing-box
        run: |
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 "$url" -o sing-box.tar.gz
          tar xzf sing-box.tar.gz --strip-components=1 -C /usr/local/bin "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box"
          sing-box version

      - name: Install mihomo
        run: |
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          curl -fsSL --retry 3 "$url" -o mihomo.gz
          gunzip -c mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v

      - name: Build geoip.dat
        run: geoip -c config.json

      - name: Sanity check
        working-directory: output
        run: |
          test -s geoip.dat
          test "$(stat -c %s geoip.dat)" -ge 300

      - name: Generate rule sets
        run: python3 .github/scripts/rulesets.py data/final output

      - name: Compile rule sets
        working-directory: output
        run: |
          set -euo pipefail
          for src in *.srs.json; do
            sing-box rule-set compile --output "${src%.srs.json}.srs" "$src"
          done
          for src in *.mrs.txt; do
            mihomo convert-ruleset ipcidr text "$src" "${src%.mrs.txt}.mrs"
          done
          rm -f *.srs.json *.mrs.txt

      - name: Checksum
        working-directory: output
        run: |
          sha256sum geoip.dat | tee geoip.dat.sha256sum
          sha256sum geoip.dat | cut -d' ' -f1 > geoip.dat.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: geoip
          path: output/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geoip
          path: output

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.run_number }}
          draft: true
          files: output/*

      - name: Verify assets
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in output/*; do
            base=$(basename "$f")
            echo "$names" | grep -qx "$base" || { echo "missing asset: $base" >&2; exit 1; }
          done

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Notify routing
        env:
          GH_TOKEN: ${{ secrets.ROUTING_DISPATCH_TOKEN }}
        run: gh api repos/vahellame/russia-whitelist-routing/dispatches -f event_type=geo-updated
